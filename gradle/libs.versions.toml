[versions]
agp = "8.12.3"
datastorePreferences = "1.2.1"
hiltNavigationCompose = "1.3.0"
kotlin = "2.2.0"
coilNetworkOkhttp = "3.4.0"
coilCompose = "3.4.0"
hilt = "2.58"
ksp = "2.2.0-2.0.2"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.12.4"
composeBom = "2026.02.00"
appcompat = "1.7.1"
material = "1.13.0"
navigationCompose = "2.9.7"
timber = "5.0.1"
room = "2.8.4"
tvMaterial = "1.0.1"
mlkitGenaiSpeech = "1.0.0-alpha1"
